name: Build and Test on All Platforms

on:
  push:
    branches: [main]
jobs:
  ## ------------------ macOS Jobs (Apple Silicon) ------------------ ##

  macos_arm64_build_deps:
    name: Build and Cache Dependencies for macOS (Apple Silicon)
    runs-on: macos-14 # ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # deps.lock drives the dependency cache key. If it drifts from the
      # versions in CMakeLists.txt, CI silently restores and reuses the OLD
      # dependencies. Nothing fails; you just build something you did not ask
      # for. This costs a second and catches it.
      - name: Verify deps.lock matches CMakeLists.txt
        shell: bash
        run: bash scripts/check-deps-lock.sh

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .fw_dependencies/install
            .fw_dependencies/stamps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('cmake/deps_builder/deps.lock') }}
          lookup-only: true

      - name: Select Xcode Version
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Tools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: brew install ninja ccache llvm@17

      - name: Set Compiler Environment
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          echo "CC=$(brew --prefix llvm@17)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@17)/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make deps-install-release

      - name: Prune dependency build tree (reduce cache size)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf .fw_dependencies/build

  macos_arm64_test:
    name: Test AOT & JIT on macOS (Apple Silicon)
    runs-on: macos-14
    needs: macos_arm64_build_deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Tools
        run: brew install ninja ccache llvm@17

      - name: Restore Dependencies from Cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .fw_dependencies/install
            .fw_dependencies/stamps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('cmake/deps_builder/deps.lock') }}

      - name: Fail if cache not found
        if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
        run: echo "Cache not found, the build-deps job should have created it." && exit 1

      - name: Set Compiler Environment
        run: |
          echo "CC=$(brew --prefix llvm@17)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@17)/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      # Removed --parallel from AOT
      - name: Build and Test AOT
        run: make test-aot ARGS="--filter=LatestTests --keep-going"

      # The step above passes no -O flag, so it exercises the compiler at its
      # default -O0 and says nothing about the optimizer. This repeats the same
      # fixtures at -O2, where LLVM inlines, folds and deletes code. A program
      # whose output changes between the two levels is an optimizer bug.
      - name: Build and Test AOT (-O2)
        if: success() || failure()
        run: make test-aot-O2 ARGS="--filter=LatestTests --keep-going"

      # And again at -O3. On this corpus -O3 leaves 9 of 12 benchmark programs
      # byte-identical to -O2, so it rarely finds anything new. It is cheap
      # insurance against the cases where it does: -O3 raises the inlining and
      # unrolling thresholds, and those are exactly the knobs that expose a
      # latent bug in generated code.
      - name: Build and Test AOT (-O3)
        if: success() || failure()
        run: make test-aot-O3 ARGS="--filter=LatestTests --keep-going"

      # GC runtime unit tests (fw-modules/gc/tests/test_gc.c). The AOT build
      # above already produced the binary, so this only runs it.
      - name: GC runtime unit tests
        if: success() || failure()
        run: make test-gc

      # Scheduler runtime unit tests (fw-modules/gc/tests/test_sched.c). Covers
      # park_io / wake_io / io_waiting / set_waiter, which the .fg fixtures
      # cannot reach because no `spawn` statement spells them.
      - name: Scheduler runtime unit tests
        if: success() || failure()
        run: make test-sched

      # Event-loop unit tests (fw-modules/uv_module/tests/test_uv.c). Drives
      # fw_uv_wake() from a real worker thread — the handoff the HTTP client
      # and async file I/O depend on, which no .fg fixture can assert about.
      - name: Event loop unit tests
        if: success() || failure()
        run: make test-uv


      # Flag combinations and emitted-ABI shape (tests/cli_fg/, written in
      # Flow-Wing). The fixture runner compiles one .fg per test with fixed
      # flags, so it cannot assert that --target=wasm32 refuses --emit=obj,
      # nor that fg_pf is declared non-variadic.
      - name: CLI contract tests
        if: success() || failure()
        run: make test-cli

      - name: Formatter golden tests
        if: success()
        run: make test-format

      # Runs even if AOT fails, ensuring we get JIT status too
      - name: Build and Test JIT
        if: success() || failure()
        run: make test-jit ARGS="--filter=LatestTests --keep-going --parallel"

      # JIT at -O2. Today the JIT path does not read the optimization level, so
      # this is expected to match the run above. It is here so that the day the
      # JIT starts optimizing, the corpus already covers it.
      - name: Build and Test JIT (-O2)
        if: success() || failure()
        run: make test-jit-O2 ARGS="--filter=LatestTests --keep-going --parallel"

      - name: Build and Test JIT (-O3)
        if: success() || failure()
        run: make test-jit-O3 ARGS="--filter=LatestTests --keep-going --parallel"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: corepack enable

      - name: Install LSP dependencies
        run: cd src/lsp && yarn install

      - name: Set compiler path for LSP tests
        run: echo "FLOWWING_COMPILER_PATH=${{ github.workspace }}/build/sdk/bin/FlowWing" >> $GITHUB_ENV

      - name: Run LSP tests
        run: make lsp-test

  ## ------------------ Windows Jobs (x86_64) ------------------ ##

  windows_x86_64_build_deps:
    name: Build and Cache Dependencies for Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Enable longpaths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      # deps.lock drives the dependency cache key. If it drifts from the
      # versions in CMakeLists.txt, CI silently restores and reuses the OLD
      # dependencies. Nothing fails; you just build something you did not ask
      # for. This costs a second and catches it.
      - name: Verify deps.lock matches CMakeLists.txt
        shell: bash
        run: bash scripts/check-deps-lock.sh

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .fw_dependencies/install
            .fw_dependencies/stamps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('cmake/deps_builder/deps.lock') }}
          lookup-only: true

      - name: Install Build Tools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: choco install -y 7zip make

      - name: Set up MSVC Developer Command Prompt
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make deps-install-release

      - name: Prune dependency build tree (reduce cache size)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf .fw_dependencies/build

  windows_x86_64_test:
    name: Test AOT on Windows (x86_64)
    runs-on: windows-latest
    needs: windows_x86_64_build_deps
    steps:
      - name: Enable longpaths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: choco install -y 7zip make

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Dependencies from Cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .fw_dependencies/install
            .fw_dependencies/stamps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('cmake/deps_builder/deps.lock') }}

      - name: Fail if cache not found
        if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
        run: echo "Cache not found, the build-deps job should have created it." && exit 1

      # Removed --parallel from AOT
      - name: Build and Test AOT
        run: make test-aot ARGS="--filter=LatestTests --keep-going"

      # The step above passes no -O flag, so it exercises the compiler at its
      # default -O0 and says nothing about the optimizer. This repeats the same
      # fixtures at -O2, where LLVM inlines, folds and deletes code. A program
      # whose output changes between the two levels is an optimizer bug.
      - name: Build and Test AOT (-O2)
        if: success() || failure()
        run: make test-aot-O2 ARGS="--filter=LatestTests --keep-going"

      # And again at -O3. On this corpus -O3 leaves 9 of 12 benchmark programs
      # byte-identical to -O2, so it rarely finds anything new. It is cheap
      # insurance against the cases where it does: -O3 raises the inlining and
      # unrolling thresholds, and those are exactly the knobs that expose a
      # latent bug in generated code.
      - name: Build and Test AOT (-O3)
        if: success() || failure()
        run: make test-aot-O3 ARGS="--filter=LatestTests --keep-going"

      # GC runtime unit tests (fw-modules/gc/tests/test_gc.c). The AOT build
      # above already produced the binary, so this only runs it.
      - name: GC runtime unit tests
        if: success() || failure()
        run: make test-gc

      # Scheduler runtime unit tests (fw-modules/gc/tests/test_sched.c). Covers
      # park_io / wake_io / io_waiting / set_waiter, which the .fg fixtures
      # cannot reach because no `spawn` statement spells them.
      - name: Scheduler runtime unit tests
        if: success() || failure()
        run: make test-sched

      # Event-loop unit tests (fw-modules/uv_module/tests/test_uv.c). Drives
      # fw_uv_wake() from a real worker thread — the handoff the HTTP client
      # and async file I/O depend on, which no .fg fixture can assert about.
      - name: Event loop unit tests
        if: success() || failure()
        run: make test-uv


      # Flag combinations and emitted-ABI shape (tests/cli_fg/, written in
      # Flow-Wing). The fixture runner compiles one .fg per test with fixed
      # flags, so it cannot assert that --target=wasm32 refuses --emit=obj,
      # nor that fg_pf is declared non-variadic.
      - name: CLI contract tests
        if: success() || failure()
        run: make test-cli

      - name: Formatter golden tests
        if: success()
        run: make test-format

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: corepack enable

      - name: Install LSP dependencies
        run: cd src/lsp && yarn install

      - name: Set compiler path for LSP tests
        run: echo "FLOWWING_COMPILER_PATH=${{ github.workspace }}/build/sdk/bin/FlowWing.exe" >> $GITHUB_ENV

      - name: Run LSP tests
        run: make lsp-test

  ## ------------------ Linux Jobs (x86_64) ------------------ ##

  linux_x86_64_build_deps:
    name: Build and Cache Dependencies for Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # deps.lock drives the dependency cache key. If it drifts from the
      # versions in CMakeLists.txt, CI silently restores and reuses the OLD
      # dependencies. Nothing fails; you just build something you did not ask
      # for. This costs a second and catches it.
      - name: Verify deps.lock matches CMakeLists.txt
        shell: bash
        run: bash scripts/check-deps-lock.sh

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .fw_dependencies/install
            .fw_dependencies/stamps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('cmake/deps_builder/deps.lock') }}
          lookup-only: true

      - name: Install Tools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 lld ninja-build ccache wget libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make deps-install-release

      - name: Prune dependency build tree (reduce cache size)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf .fw_dependencies/build

  linux_x86_64_test:
    name: Test AOT & JIT on Linux (x86_64)
    runs-on: ubuntu-latest
    needs: linux_x86_64_build_deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 lld ninja-build ccache wget libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

      - name: Restore Dependencies from Cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .fw_dependencies/install
            .fw_dependencies/stamps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('cmake/deps_builder/deps.lock') }}

      - name: Fail if cache not found
        if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
        run: echo "Cache not found, the build-deps job should have created it." && exit 1

      # Removed --parallel from AOT
      - name: Build and Test AOT
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-aot ARGS="--filter=LatestTests --keep-going"

      # The step above passes no -O flag, so it exercises the compiler at its
      # default -O0 and says nothing about the optimizer. This repeats the same
      # fixtures at -O2, where LLVM inlines, folds and deletes code. A program
      # whose output changes between the two levels is an optimizer bug.
      - name: Build and Test AOT (-O2)
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-aot-O2 ARGS="--filter=LatestTests --keep-going"

      # And again at -O3. On this corpus -O3 leaves 9 of 12 benchmark programs
      # byte-identical to -O2, so it rarely finds anything new. It is cheap
      # insurance against the cases where it does: -O3 raises the inlining and
      # unrolling thresholds, and those are exactly the knobs that expose a
      # latent bug in generated code.
      - name: Build and Test AOT (-O3)
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-aot-O3 ARGS="--filter=LatestTests --keep-going"

      # GC runtime unit tests (fw-modules/gc/tests/test_gc.c). The AOT build
      # above already produced the binary, so this only runs it.
      - name: GC runtime unit tests
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-gc

      # Scheduler runtime unit tests (fw-modules/gc/tests/test_sched.c). Covers
      # park_io / wake_io / io_waiting / set_waiter, which the .fg fixtures
      # cannot reach because no `spawn` statement spells them.
      - name: Scheduler runtime unit tests
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-sched

      # Event-loop unit tests — see the note on the other platforms.
      - name: Event loop unit tests
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-uv


      # Flag combinations and emitted-ABI shape (tests/cli_fg/, written in
      # Flow-Wing). The fixture runner compiles one .fg per test with fixed
      # flags, so it cannot assert that --target=wasm32 refuses --emit=obj,
      # nor that fg_pf is declared non-variadic.
      - name: CLI contract tests
        if: success() || failure()
        run: make test-cli

      - name: Formatter golden tests
        if: success()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-format

      # The LatestTests fixtures again, built with --target=wasm32, run under
      # Node and compared with the same .expect files (tests/wasm_parity.py).
      # It catches what only a wasm build can get wrong: 4-byte pointers,
      # runtime signatures that wasm-ld checks and native linkers never do, and
      # output that passes through JavaScript. Fixtures that use what wasm
      # cannot do yet (spawn, the file/mongo/vortex modules) are counted as
      # unsupported, not failed.
      #
      # Linux only: a wasm build targets the same machine whichever host
      # compiled it, so one platform covers it.
      #
      # Pinned to the emsdk version the wasm work was verified with. The cache
      # holds the whole SDK, including the system libraries emcc builds on
      # first use, so a warm run skips both the download and those builds.
      - name: Cache Emscripten SDK
        id: cache-emsdk
        if: success() || failure()
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-${{ runner.arch }}-emsdk-6.0.10

      - name: Install Emscripten SDK
        if: (success() || failure()) && steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.10
          ~/emsdk/emsdk activate 6.0.10
          rm -rf ~/emsdk/downloads

      # emsdk_env.sh puts emcc and emsdk's own Node on PATH; the compiler would
      # find ~/emsdk by itself, but the parity script needs `node`.
      - name: WebAssembly parity tests
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: |
          source ~/emsdk/emsdk_env.sh
          make test-wasm

      # Runs even if AOT fails, ensuring we get JIT status too
      - name: Build and Test JIT
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-jit ARGS="--filter=LatestTests --keep-going --parallel"

      # JIT at -O2. Today the JIT path does not read the optimization level, so
      # this is expected to match the run above. It is here so that the day the
      # JIT starts optimizing, the corpus already covers it.
      - name: Build and Test JIT (-O2)
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-jit-O2 ARGS="--filter=LatestTests --keep-going --parallel"

      - name: Build and Test JIT (-O3)
        if: success() || failure()
        env:
          CC: clang-17
          CXX: clang++-17
          LDFLAGS: -fuse-ld=lld
        run: make test-jit-O3 ARGS="--filter=LatestTests --keep-going --parallel"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: corepack enable

      - name: Install LSP dependencies
        run: cd src/lsp && yarn install

      - name: Set compiler path for LSP tests
        run: echo "FLOWWING_COMPILER_PATH=${{ github.workspace }}/build/sdk/bin/FlowWing" >> $GITHUB_ENV

      - name: Run LSP tests
        run: make lsp-test
